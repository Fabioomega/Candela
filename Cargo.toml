[package]
name = "candela"
version = "0.1.0"
edition = "2024"

[features]
default = ["tracing"]
tracing = []
# Enables the Intel MKL backend and makes it the `DefaultBackend`. Off by
# default so the pure-Rust build skips compiling/linking MKL entirely.
mkl = ["dep:intel-mkl-src", "dep:intel-mkl-sys", "dep:cblas", "dep:cblas-sys"]

[dev-dependencies]
tracing-subscriber = "0.3.23"
approx = "0.5"
proptest = "1"
rstest = "0.26.1"
rstest_reuse = "0.7"

[dependencies]
tracing = "0.1.44"
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
intel-mkl-sys = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
cblas = { version = "0.5.0", optional = true }
cblas-sys = { version = "0.3.0", optional = true }
matrixmultiply = "0.3.10"
