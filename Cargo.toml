[package]
name = "candela"
version = "0.1.0"
edition = "2024"

[features]
default = ["tracing"]
tracing = []

[dev-dependencies]
tracing-subscriber = "0.3.23"
approx = "0.5"
proptest = "1"
rstest = "0.26.1"
rstest_reuse = "0.7"

[dependencies]
tracing = "0.1.44"
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
intel-mkl-sys = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
cblas = "0.5.0"
cblas-sys = "0.3.0"
matrixmultiply = "0.3.10"
