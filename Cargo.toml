[package]
exclude = ["project_decision.txt", ".gitignore", "doc/internals", ".github/"]

name = "candela-tensor"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A lazy, graph-based tensor engine in Rust"
repository = "https://github.com/Fabioomega/Candela"
readme = "README.md"
categories = ["artificial-intelligence", "mathematics", "science"]
keywords = ["blas", "tensor", "machine-learning"]

[lib]
name = "candela"

[features]
default = ["rand"]
rand = ["dep:rand", "dep:rand_distr"]
tracing = ["dep:tracing"]
# Enables the Intel MKL backend and makes it the `DefaultBackend`. Off by
# default so the pure-Rust build skips compiling/linking MKL entirely.
mkl = ["dep:intel-mkl-src", "dep:intel-mkl-sys", "dep:cblas", "dep:cblas-sys"]

[dev-dependencies]
tracing-subscriber = "0.3.23"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
rstest = "0.26.1"
rstest_reuse = "0.7"

[[bench]]
name = "my_bench"
harness = false

[dependencies]
tracing = { version = "0.1.44", optional = true }
intel-mkl-src = { version = "0.8.1", features = [
    "mkl-dynamic-lp64-iomp",
], optional = true }
intel-mkl-sys = { version = "0.8.1", features = [
    "mkl-dynamic-lp64-iomp",
], optional = true }
cblas = { version = "0.5.0", optional = true }
cblas-sys = { version = "0.3.0", optional = true }
matrixmultiply = "0.3.10"
rand = { version = "0.10.2", optional = true }
rand_distr = { version = "0.6.0", optional = true }
